[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "esp32-s3-remote-hid-client"
version = "0.1.0"
description = "Python REST and WebSocket client for an ESP32-S3 Remote HID keyboard"
requires-python = ">=3.10"
dependencies = ["websockets==15.0.1"]

[tool.setuptools.packages.find]
include = ["remote_hid_client*"]
